name: build
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build
        env:
          HQ_KEYSTORE_B64: ${{ secrets.HQ_KEYSTORE_B64 }}
          HQ_KEYSTORE_PASS: ${{ secrets.HQ_KEYSTORE_PASS }}
        run: |
          echo "$HQ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hq.jks"
          export HQ_KEYSTORE_PATH="$RUNNER_TEMP/hq.jks"
          set -o pipefail
          export VERSION_CODE=${{ github.run_number }}
          export VERSION_NAME=0.${{ github.run_number }}
          # logic tests, screenshot renders (light and dark), lint, then the signed release APK
          gradle --continue --no-daemon --stacktrace \
            :core:model:test \
            :core:designsystem:recordPaparazziDebug \
            :app:lintDebug \
            :app:assembleRelease 2>&1 | tee build.log
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p shots
          cp -r core/designsystem/src/test/snapshots/images/. shots/ 2>/dev/null || true
          if [ -n "$(ls -A shots)" ]; then (cd shots && zip -qr ../screenshots.zip .); fi
      - name: Check the APK is signed with the HQ key
        if: success()
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee sign.txt
      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: HQ Fit 0.${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            screenshots.zip
      - name: Publish build log and screenshots
        if: always()
        run: |
          mkdir -p /tmp/l/shots
          cp build.log /tmp/l/build.log 2>/dev/null || echo "no log" > /tmp/l/build.log
          tail -c 80000 /tmp/l/build.log > /tmp/l/tail.log
          cp -r shots/. /tmp/l/shots/ 2>/dev/null || true
          cp sign.txt /tmp/l/sign.txt 2>/dev/null || true
          cp app/build/lint-report.txt /tmp/l/lint-report.txt 2>/dev/null || true
          echo "${{ job.status }} run ${{ github.run_number }} sha ${{ github.sha }}" > /tmp/l/status.txt
          git config user.name hq-fit-bot
          git config user.email hq-fit-bot@users.noreply.github.com
          git checkout --orphan build-log
          git rm -rf -q . || true
          cp /tmp/l/tail.log build.log
          cp /tmp/l/status.txt status.txt
          cp /tmp/l/sign.txt sign.txt 2>/dev/null || true
          cp /tmp/l/lint-report.txt lint-report.txt 2>/dev/null || true
          cp -r /tmp/l/shots shots
          git add build.log status.txt sign.txt lint-report.txt shots 2>/dev/null || git add -A
          git commit -q -m "log ${{ github.run_number }}"
          git push -f origin build-log
